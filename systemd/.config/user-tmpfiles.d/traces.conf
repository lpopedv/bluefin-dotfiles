# Keeps records of what was opened, edited or typed off the disk. Applied at
# each login by systemd-tmpfiles-setup.service (user), enabled by bootstrap.sh.
# ~/.cache stays on disk: making it tmpfs needs root and an image change.

# Each path becomes a symlink into $XDG_RUNTIME_DIR (RAM). Targets are created
# first because programs can't mkdir through a dangling symlink.
d %t/state 0700 - - -
d %t/state/nvim 0700 - - -
d %t/state/lazygit 0700 - - -
d %t/state/herdr-snapshots 0700 - - -
# shada (open files, registers, history), swap files and logs.
L+ %h/.local/state/nvim - - - - %t/state/nvim
# Recent repositories and PR cache.
L+ %h/.local/state/lazygit - - - - %t/state/lazygit
# Every prompt typed, never pruned by cleanupPeriodDays.
L+ %h/.claude/history.jsonl - - - - %t/state/claude-history.jsonl
# session.json stays on disk: herdr restores the workspace from it after a reboot.
L+ %h/.config/herdr/herdr-server.log - - - - %t/state/herdr-server.log
L+ %h/.config/herdr/herdr-client.log - - - - %t/state/herdr-client.log
L+ %h/.config/herdr/session-snapshots - - - - %t/state/herdr-snapshots

# Wiped instead of redirected: gvfsd-metadata may not cope with a symlink.
R %h/.local/share/gvfs-metadata
R %h/.local/share/nautilus/tags
# Old entries only; desktop.dconf turns off remember-recent-files.
r %h/.local/share/recently-used.xbel
