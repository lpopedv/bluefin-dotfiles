kernel.dmesg_restrict=1
kernel.kptr_restrict=2
kernel.sysrq=0
# Debuggers (gdb, strace) need sudo to attach to a running process.
kernel.yama.ptrace_scope=2
kernel.kexec_load_disabled=1
dev.tty.ldisc_autoload=0
fs.protected_fifos=2
fs.protected_regular=2
fs.suid_dumpable=0
# The largest source of local privilege-escalation CVEs. Programs fall back to
# epoll/threads; Docker's seccomp profile already blocks it in containers.
kernel.io_uring_disabled=2
kernel.unprivileged_bpf_disabled=1
net.core.bpf_jit_harden=2
vm.mmap_rnd_bits=32
vm.mmap_rnd_compat_bits=16
vm.unprivileged_userfaultfd=0

# Globbed, not all/default: the kernel combines `all` with each interface's own
# value. The glob also covers interfaces created later, such as Docker bridges.
# rp_filter stays at Fedora's loose 2: strict breaks NetworkManager's
# connectivity check, which Bluefin's updater waits on.
net.ipv4.conf.*.send_redirects=0
net.ipv4.conf.*.accept_redirects=0
net.ipv6.conf.*.accept_redirects=0
net.ipv4.tcp_rfc1337=1
