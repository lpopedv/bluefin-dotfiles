# A new network identity every boot: MAC, DHCP client ID, DHCPv6 DUID and IPv6
# address derive from stable-id, which changes with ${BOOT}. The hostname is
# never sent to DHCP servers. Wi-Fi MACs follow Fedora's own rule (stable-ssid).
[connection]
connection.stable-id=${CONNECTION}/${BOOT}
ethernet.cloned-mac-address=stable
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=stable-uuid
ipv6.addr-gen-mode=stable-privacy
# Prefer temporary (rotating) IPv6 addresses for outgoing connections.
ipv6.ip6-privacy=2
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
