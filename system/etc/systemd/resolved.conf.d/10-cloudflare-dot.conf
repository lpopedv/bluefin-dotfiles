# "#cloudflare-dns.com" is not a comment: resolved checks the TLS cert against it.
# Strict: no plain-DNS fallback, so captive portals fail to resolve until the
# login (see README). Empty FallbackDNS: never use another resolver. DNSSEC is
# validated by Cloudflare. LLMNR off: it asks the LAN for unknown names and trusts
# whoever answers (avahi still handles mDNS).
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com
FallbackDNS=
DNSOverTLS=yes
DNSSEC=no
LLMNR=no
