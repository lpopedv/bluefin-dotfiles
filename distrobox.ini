# Arch dev box sharing $HOME with the host, created by bootstrap.sh. Changes take
# effect only after `distrobox rm -f dev` and a re-run of bootstrap.sh.
# Language runtimes come from mise (mise/.config/mise), not pacman.
[dev]
image=quay.io/toolbx/arch-toolbox:latest
pull=true
init=false
# Exported to ~/.local/bin so EDITOR=nvim also works on the host.
exported_bins="/usr/bin/nvim"
additional_packages="base-devel sudo openssh man-db less tree unzip wget glibc-locales"
# Used by the herdr scripts and the Claude hooks.
additional_packages="python"
additional_packages="zsh zsh-syntax-highlighting fzf eza fd bat ripgrep jq btop neovim lazygit stow mise github-cli just"
# Needed by mise to compile erlang.
additional_packages="autoconf m4 ncurses openssl"
# Used by Elixir's file watchers (Phoenix live reload, mix test.watch).
additional_packages="inotify-tools"
# herdr copies the selection with wl-copy; without it, it falls back to OSC 52,
# which Ptyxis ignores.
additional_packages="wl-clipboard"
# The docker CLI talks to the host daemon through /var/run/docker.sock.
additional_packages="docker docker-compose kubectl aws-cli-v2"
